<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Branding & Promo Generator v3.2</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --panel-bg: #1e293b;
      --text-panel: #f8fafc;
      --border-panel: #334155;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text-panel);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-title { text-align: center; margin-bottom: 15px; }
    .header-title h2 { margin: 0 0 4px 0; color: #6366f1; font-size: 20px; }
    .header-title p { margin: 0; font-size: 12px; color: #94a3b8; }

    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 1100px;
      width: 100%;
    }

    @media (min-width: 850px) {
      .container { flex-direction: row; align-items: flex-start; }
    }

    /* CONTROL PANEL */
    .control-panel {
      background: var(--panel-bg);
      padding: 18px;
      border-radius: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border-panel);
      max-height: 88vh;
      overflow-y: auto;
    }

    .form-group { display: flex; flex-direction: column; gap: 3px; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }

    label { font-size: 11px; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
    select, input, textarea {
      padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border-panel);
      background: #0f172a; color: #fff; font-size: 12px; width: 100%;
    }
    textarea { resize: vertical; height: 60px; }
    input[type="color"] { height: 32px; padding: 2px; cursor: pointer; }

    button.btn-download {
      background: #22c55e; color: #fff; border: none; padding: 10px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 8px;
    }
    button.btn-download:hover { background: #16a34a; }

    /* PREVIEW PANEL */
    .preview-panel {
      flex: 1.2; display: flex; justify-content: center; align-items: center;
      background: #020617; padding: 20px; border-radius: 12px; overflow: auto; min-height: 500px;
      border: 1px solid var(--border-panel);
    }

    #capture-area {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 20px 30px rgba(0,0,0,0.6);
      background: #fff; transition: all 0.3s ease; border-radius: 0 !important; /* PERBAIKAN: KOTAK UTUH SIKU PERFECT */
    }

    /* CANVAS RATIOS */
    .ratio-story { width: 320px; height: 568px; }    /* 9:16 */
    .ratio-portrait { width: 320px; height: 400px; } /* 4:5 Instagram Feed */
    .ratio-post { width: 360px; height: 360px; }     /* 1:1 */
    .ratio-wide { width: 440px; height: 247px; }     /* 16:9 */

    .ui-wrapper {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      position: relative; overflow: hidden; background-size: cover; background-position: center;
    }

    /* OVERLAY MASK */
    .overlay-mask {
      position: absolute; top:0; left:0; width:100%; height:100%; z-index: 1; pointer-events: none;
    }
    .overlay-dark { background: rgba(0,0,0, 0.65); }
    .overlay-light { background: rgba(255,255,255, 0.8); }
    .overlay-none { background: transparent; }

    .content-layer {
      position: relative; z-index: 2; width: 100%; height: 100%;
      display: flex; flex-direction: column; padding: 14px; box-sizing: border-box;
      white-space: pre-wrap; word-break: break-word; justify-content: space-between;
    }

    /* INHERIT FONT SELECTION FIXED */
    .content-layer * { font-family: inherit !important; }

    /* TYPOGRAPHY FAMILY CLASSES */
    .font-sans { font-family: system-ui, -apple-system, sans-serif !important; }
    .font-serif { font-family: "Playfair Display", "Georgia", serif !important; }
    .font-georgia { font-family: "Georgia", serif !important; }
    .font-mono { font-family: "Courier New", Courier, monospace !important; }

    /* REALISTIC BOOK MOCKUP (RATIO NOVEL 1:1.5) */
    .real-book-3d {
      width: 80px; height: 120px; background-size: cover; background-position: center;
      border-radius: 2px 5px 5px 2px; position: relative;
      box-shadow: -10px 8px 18px rgba(0,0,0,0.6), inset 4px 0 6px rgba(255,255,255,0.3);
      transform: perspective(600px) rotateY(-18deg) rotateX(3deg); flex-shrink: 0;
    }
    .real-book-3d::after {
      content: ''; position: absolute; right: -7px; top: 1px; bottom: 1px; width: 7px;
      background: linear-gradient(90deg, #fff 0%, #e2e8f0 80%, #cbd5e1 100%);
      transform: perspective(600px) rotateY(40deg); border-radius: 0 2px 2px 0;
    }

    .real-phone-mockup {
      width: 65px; height: 115px; background-size: cover; background-position: center;
      border: 4px solid #0f172a; border-radius: 12px; position: relative;
      box-shadow: -4px 8px 16px rgba(0,0,0,0.5); flex-shrink: 0; overflow: hidden;
    }
    .real-phone-mockup::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 22px; height: 4px; background: #0f172a; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; z-index: 10;
    }

    .pill-tag {
      background: rgba(255,255,255,0.2); backdrop-filter: blur(4px);
      padding: 2px 8px; border-radius: 12px; font-size: 9px; font-weight: bold;
      border: 1px solid rgba(255,255,255,0.3); display: inline-block; align-self: center;
    }

    .btn-cta {
      padding: 5px 12px; border-radius: 16px; font-weight: bold; font-size: 9px;
      text-align: center; align-self: center; box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      letter-spacing: 0.5px; margin-top: 2px;
    }

    /* INLINE QUOTE STYLING FOR STYLE 3 */
    .quote-mark {
      font-size: 20px; line-height: 0; vertical-align: -3px; font-weight: bold; margin: 0 2px; display: inline-block;
    }

    /* STYLES & 16:9 RESPONSIVE FIXES */
    .s1-container { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; height: 100%; justify-content: center; }
    .s1-mockups { display: flex; align-items: flex-end; justify-content: center; gap: 0px; margin: 4px 0; }
    .s1-mockups .real-phone-mockup { margin-left: -20px; transform: translateY(6px) rotate(-4deg); z-index: 2; }

    .s2-container { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; height: 100%; justify-content: center; }
    .s2-icons { display: flex; justify-content: space-around; width: 100%; margin: 2px 0; }
    .s2-icon-box { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 8px; }
    .s2-circle { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 11px; }

    .s3-container { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: center; height: 100%; }

    /* STYLE 4 FIXES */
    .s4-container { display: flex; flex-direction: column; gap: 4px; height: 100%; justify-content: center; }
    .s4-head { display: flex; gap: 8px; align-items: center; }
    .stars { color: #f59e0b; font-size: 11px; margin-top: 1px; }
    .review-card { background: rgba(255,255,255,0.12); backdrop-filter: blur(6px); border-radius: 6px; padding: 6px 8px; border: 1px solid rgba(255,255,255,0.2); }

    .s5-container { display: flex; flex-direction: column; gap: 4px; height: 100%; justify-content: center; }
    .s5-layout { display: flex; gap: 8px; align-items: center; }
    .char-avatar { width: 65px; height: 85px; border-radius: 6px; background-size: cover; background-position: center; border: 2px solid rgba(255,255,255,0.4); flex-shrink: 0; }

    .s6-container { display: flex; flex-direction: column; gap: 4px; height: 100%; justify-content: center; }
    .trope-list { display: flex; flex-direction: column; gap: 2px; font-size: 8px; margin-top: 2px; }
    .trope-item { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.12); padding: 2px 5px; border-radius: 3px; }

    .s7-container { display: flex; flex-direction: column; gap: 4px; height: 100%; justify-content: center; }
    .versus-container { display: flex; height: 68%; gap: 6px; width: 100%; }
    .versus-side {
      flex: 1; border-radius: 6px; padding: 6px; display: flex; flex-direction: column;
      justify-content: flex-end; text-align: center; background-size: cover;
      position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.3);
    }
    .versus-overlay { position: absolute; inset:0; background: linear-gradient(180deg, transparent 20%, rgba(0,0,0,0.85) 100%); z-index: 1; }
    .versus-text { position: relative; z-index: 2; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

    .s8-container { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: center; height: 100%; }
    .s8-badge { background: #ef4444; color: #fff; padding: 3px 10px; border-radius: 4px; font-weight: 900; font-size: 10px; letter-spacing: 1px; }

    .s9-container { display: flex; flex-direction: column; gap: 4px; height: 100%; justify-content: center; }
    .snippet-paper { background: #fefec8; color: #1c1917; padding: 8px 10px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .highlight { background: #fde047; padding: 0 2px; border-radius: 2px; font-weight: bold; color: #000; }

    /* LAYOUT COMPACT SPECIFIC FOR 16:9 CANVAS */
    .ratio-wide .real-book-3d { width: 55px; height: 82px; }
    .ratio-wide .real-phone-mockup { width: 45px; height: 80px; }
    .ratio-wide .char-avatar { width: 50px; height: 65px; }
    .ratio-wide .s1-container, .ratio-wide .s2-container, .ratio-wide .s3-container, 
    .ratio-wide .s4-container, .ratio-wide .s5-container, .ratio-wide .s6-container,
    .ratio-wide .s7-container, .ratio-wide .s8-container, .ratio-wide .s9-container {
      gap: 2px;
    }
    .ratio-wide h3, .ratio-wide h4 { font-size: 12px !important; margin: 0 !important; }
    .ratio-wide p { font-size: 8px !important; margin: 1px 0 !important; }
  </style>
</head>
<body>

  <div class="header-title">
    <h2>Book Branding & Promo Generator</h2>
    <p>Generator Grafis Promosi Buku Digital & Cetak v3.2</p>
  </div>

  <div class="container">
    <!-- CONTROL PANEL -->
    <div class="control-panel">
      
      <div class="form-row">
        <div class="form-group">
          <label>Pilih Tipe Desain:</label>
          <select id="select-style" onchange="handleStyleChange()">
            <option value="1">1. Dual Mockup (Book Branding)</option>
            <option value="2">2. Commercial Promo Card</option>
            <option value="3">3. Aesthetic POV / Quote</option>
            <option value="4">4. Review & Rating Card</option>
            <option value="5">5. Character Profile</option>
            <option value="6">6. Tropes & Plot Checklist</option>
            <option value="7">7. Versus / Character Conflict</option>
            <option value="8">8. Countdown / Event Banner</option>
            <option value="9">9. Chapter Snippet Highlight</option>
          </select>
        </div>

        <div class="form-group">
          <label>Rasio Kanvas:</label>
          <select id="select-ratio" onchange="updateRatio()">
            <option value="ratio-story">TikTok / Story (9:16)</option>
            <option value="ratio-portrait">Instagram Feed (4:5)</option>
            <option value="ratio-post">Instagram Post (1:1)</option>
            <option value="ratio-wide">Versi Lebar (16:9)</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Jenis Font:</label>
          <select id="select-font" onchange="renderUI()">
            <option value="font-sans">Modern (Sans-Serif)</option>
            <option value="font-serif">Elegance (Playfair/Serif)</option>
            <option value="font-georgia">Novel Classic (Georgia)</option>
            <option value="font-mono">Typewriter (Monospace)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Warna Teks Utama:</label>
          <input type="color" id="input-text-color" value="#ffffff" onchange="renderUI()">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Filter Overlay:</label>
          <select id="select-overlay" onchange="renderUI()">
            <option value="overlay-dark">Gelap (Redupkan Latar)</option>
            <option value="overlay-light">Terang (Putih Transparan)</option>
            <option value="overlay-none">Tanpa Overlay</option>
          </select>
        </div>
        <div class="form-group">
          <label>Warna Tombol CTA:</label>
          <input type="color" id="input-cta-color" value="#2563eb" onchange="renderUI()">
        </div>
      </div>

      <hr style="border:none; border-top:1px solid var(--border-panel); margin:2px 0;">

      <!-- LATAR BELAKANG OPTIONS -->
      <div class="form-group">
        <label>Mode Latar Belakang:</label>
        <select id="select-bg-mode" onchange="toggleBgInputs()">
          <option value="image">Foto Dari Galeri</option>
          <option value="solid">Warna Solid</option>
          <option value="gradient">Warna Gradien Modern</option>
        </select>
      </div>

      <div id="bg-file-group" class="form-group">
        <label>Upload Latar Belakang:</label>
        <input type="file" id="file-bg" accept="image/*" onchange="handleFileBG(event)">
      </div>

      <div id="bg-color-group" class="form-row" style="display:none;">
        <div class="form-group">
          <label>Warna Latar 1:</label>
          <input type="color" id="input-bg-color1" value="#0f172a" onchange="renderUI()">
        </div>
        <div class="form-group" id="bg-color2-container" style="display:none;">
          <label>Warna Latar 2:</label>
          <input type="color" id="input-bg-color2" value="#1e1b4b" onchange="renderUI()">
        </div>
      </div>

      <hr style="border:none; border-top:1px solid var(--border-panel); margin:2px 0;">

      <!-- MEDIA INPUTS -->
      <div id="cover-upload-group" class="form-group">
        <label>Upload Cover Buku:</label>
        <input type="file" id="file-cover" accept="image/*" onchange="handleFileCover(event)">
      </div>

      <!-- SPECIAL INPUT FOR STYLE 5 (CHAR PROFILE) -->
      <div id="char-upload-group" class="form-group" style="display:none;">
        <label>Upload Foto Karakter:</label>
        <input type="file" id="file-char-single" accept="image/*" onchange="handleFileCharSingle(event)">
      </div>

      <!-- SPECIAL INPUT FOR STYLE 7 (VERSUS) -->
      <div id="versus-upload-group" class="form-group" style="display:none;">
        <div class="form-row">
          <div class="form-group">
            <label>Foto Tokoh A:</label>
            <input type="file" id="file-char-a" accept="image/*" onchange="handleFileCharA(event)">
          </div>
          <div class="form-group">
            <label>Foto Tokoh B:</label>
            <input type="file" id="file-char-b" accept="image/*" onchange="handleFileCharB(event)">
          </div>
        </div>
        <div class="form-group" style="margin-top:4px;">
          <label>Fokus Foto Tokoh:</label>
          <select id="select-char-pos" onchange="renderUI()">
            <option value="center">Tengah (Default)</option>
            <option value="top">Atas (Fokus Wajah)</option>
            <option value="bottom">Bawah</option>
          </select>
        </div>
      </div>

      <!-- TOOLS KHUSUS DESAIN 2 (IKON PICKER) -->
      <div id="style2-tools" class="form-row" style="display:none;">
        <div class="form-group"><label>Ikon 1:</label><input type="text" id="s2-i1" value="👑" oninput="renderUI()"></div>
        <div class="form-group"><label>Ikon 2:</label><input type="text" id="s2-i2" value="🔥" oninput="renderUI()"></div>
        <div class="form-group"><label>Ikon 3:</label><input type="text" id="s2-i3" value="❤️" oninput="renderUI()"></div>
      </div>

      <!-- TOOLS KHUSUS DESAIN 4 (PROOF DATA) -->
      <div id="style4-tools" class="form-row" style="display:none;">
        <div class="form-group"><label>Bintang Rating:</label><input type="text" id="s4-rating" value="5.0 / 5.0" oninput="renderUI()"></div>
        <div class="form-group"><label>Jumlah Ulasan/Pembaca:</label><input type="text" id="s4-readers" value="10.000+ Ulasan Pembaca" oninput="renderUI()"></div>
      </div>

      <!-- TEXT INPUTS -->
      <div class="form-group">
        <label id="lbl-title">Judul Buku / Header Utama:</label>
        <input type="text" id="input-title" value="Cinta di Bawah Bayang-Bayang" oninput="renderUI()">
      </div>

      <div class="form-group">
        <label id="lbl-subtitle">Sub-Header / Genre / Label:</label>
        <input type="text" id="input-subtitle" value="ROMANSA • DRAMA • INSPIRATIF" oninput="renderUI()">
      </div>

      <div class="form-group">
        <label id="lbl-body">Isi Teks / Blurb / Quote / Tropes:</label>
        <textarea id="input-body" oninput="renderUI()">Bukan tentang diselamatkan, tapi tentang keberanian untuk bangkit dan memilih jalan hidup sendiri.</textarea>
      </div>

      <div class="form-group">
        <label>Teks Tombol CTA:</label>
        <input type="text" id="input-cta" value="BACA SEKARANG DI KBM APP" oninput="renderUI()">
      </div>

      <button class="btn-download" onclick="downloadImage()">Download Gambar PNG</button>
    </div>

    <!-- PREVIEW PANEL -->
    <div class="preview-panel">
      <div id="capture-area" class="ratio-story">
        <div id="ui-render-target" class="ui-wrapper"></div>
      </div>
    </div>
  </div>

  <script>
    // State default media
    let coverImg = 'https://picsum.photos/id/1025/300/450';
    let bgImg = 'https://picsum.photos/id/1043/800/1200';
    let charSingleImg = 'https://picsum.photos/id/64/300/400';
    let charAImg = 'https://picsum.photos/id/64/300/400';
    let charBImg = 'https://picsum.photos/id/91/300/400';

    function updateRatio() {
      document.getElementById('capture-area').className = document.getElementById('select-ratio').value;
      renderUI();
    }

    function toggleBgInputs() {
      const mode = document.getElementById('select-bg-mode').value;
      const fileGroup = document.getElementById('bg-file-group');
      const colorGroup = document.getElementById('bg-color-group');
      const color2Container = document.getElementById('bg-color2-container');

      if (mode === 'image') {
        fileGroup.style.display = 'flex';
        colorGroup.style.display = 'none';
      } else if (mode === 'solid') {
        fileGroup.style.display = 'none';
        colorGroup.style.display = 'flex';
        color2Container.style.display = 'none';
      } else {
        fileGroup.style.display = 'none';
        colorGroup.style.display = 'flex';
        color2Container.style.display = 'flex';
      }
      renderUI();
    }

    function handleStyleChange() {
      const style = document.getElementById('select-style').value;
      
      document.getElementById('versus-upload-group').style.display = (style === '7') ? 'block' : 'none';
      document.getElementById('char-upload-group').style.display = (style === '5') ? 'flex' : 'none';
      document.getElementById('cover-upload-group').style.display = (style === '7') ? 'none' : 'flex';
      
      document.getElementById('style2-tools').style.display = (style === '2') ? 'flex' : 'none';
      document.getElementById('style4-tools').style.display = (style === '4') ? 'flex' : 'none';

      const lblSubtitle = document.getElementById('lbl-subtitle');
      const lblBody = document.getElementById('lbl-body');

      if (style === '7') {
        lblBody.innerText = "Sifat / Kontras Tokoh A (Baris 1) & Tokoh B (Baris 2):";
        document.getElementById('input-body').value = "CEO Dingin & Perfeksionis\nAdmin Percetakan yang Ceria";
      } else if (style === '6') {
        lblSubtitle.innerText = "Header Keterangan List:";
        document.getElementById('input-subtitle').value = "APA YANG BISA KAMU HARAPKAN:";
        lblBody.innerText = "Daftar Checklist Tropes (Gunakan Enter/Garis Baru):";
        document.getElementById('input-body').value = "Enemies to Lovers\nMarriage of Convenience\nForced Proximity\nHe Falls First";
      } else if (style === '8') {
        document.getElementById('lbl-title').innerText = "Status Event / Header Besar:";
        document.getElementById('input-title').value = "H-3 BAB BARU RILIS";
        lblSubtitle.innerText = "Sub-Header / Tanggal:";
        document.getElementById('input-subtitle').value = "Jumat, 20.00 WIB Di KBM App";
      } else {
        lblSubtitle.innerText = "Sub-Header / Genre / Label:";
        lblBody.innerText = "Isi Teks / Blurb / Quote / Deskripsi:";
      }
      renderUI();
    }

    function handleFileCover(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => { coverImg = ev.target.result; renderUI(); };
        reader.readAsDataURL(file);
      }
    }

    function handleFileBG(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => { bgImg = ev.target.result; renderUI(); };
        reader.readAsDataURL(file);
      }
    }

    function handleFileCharSingle(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => { charSingleImg = ev.target.result; renderUI(); };
        reader.readAsDataURL(file);
      }
    }

    function handleFileCharA(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => { charAImg = ev.target.result; renderUI(); };
        reader.readAsDataURL(file);
      }
    }

    function handleFileCharB(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => { charBImg = ev.target.result; renderUI(); };
        reader.readAsDataURL(file);
      }
    }

    function renderUI() {
      const style = document.getElementById('select-style').value;
      const fontClass = document.getElementById('select-font').value;
      const textColor = document.getElementById('input-text-color').value;
      const overlayClass = document.getElementById('select-overlay').value;
      const ctaColor = document.getElementById('input-cta-color').value;
      
      const title = document.getElementById('input-title').value;
      const subtitle = document.getElementById('input-subtitle').value;
      const body = document.getElementById('input-body').value;
      const cta = document.getElementById('input-cta').value;

      const target = document.getElementById('ui-render-target');

      // Background Mode
      const bgMode = document.getElementById('select-bg-mode').value;
      if (bgMode === 'image') {
        target.style.background = `url('${bgImg}') center/cover no-repeat`;
      } else if (bgMode === 'solid') {
        target.style.background = document.getElementById('input-bg-color1').value;
      } else {
        const c1 = document.getElementById('input-bg-color1').value;
        const c2 = document.getElementById('input-bg-color2').value;
        target.style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
      }

      let innerContent = '';

      switch(style) {
        case '1': // Dual Mockup Realistis (Spine Shadow + Book Novel Aspect Ratio)
          innerContent = `
            <div class="s1-container">
              <span class="pill-tag">${subtitle}</span>
              <h3 style="margin:2px 0; font-size:15px; line-height:1.2;">${title}</h3>
              <div class="s1-mockups">
                <div class="real-book-3d" style="background-image:url('${coverImg}');"></div>
                <div class="real-phone-mockup" style="background-image:url('${coverImg}');"></div>
              </div>
              <p style="font-size:9.5px; line-height:1.35; margin:2px 0; opacity:0.9;">"${body}"</p>
              <div class="btn-cta" style="background:${ctaColor}; color:#fff;">${cta}</div>
            </div>
          `;
          break;

        case '2': // Commercial Promo Card
          const i1 = document.getElementById('s2-i1').value;
          const i2 = document.getElementById('s2-i2').value;
          const i3 = document.getElementById('s2-i3').value;
          innerContent = `
            <div class="s2-container">
              <span class="pill-tag">RECOMMENDED NOVEL</span>
              <h3 style="margin:2px 0; font-size:15px; line-height:1.2;">${title}</h3>
              <small style="font-size:8.5px; opacity:0.8;">${subtitle}</small>
              <div class="real-book-3d" style="background-image:url('${coverImg}');"></div>
              <p style="font-size:9px; font-style:italic; margin:2px 0; line-height:1.3;">"${body}"</p>
              <div class="s2-icons">
                <div class="s2-icon-box"><div class="s2-circle">${i1}</div><span>Populer</span></div>
                <div class="s2-icon-box"><div class="s2-circle">${i2}</div><span>Trending</span></div>
                <div class="s2-icon-box"><div class="s2-circle">${i3}</div><span>Favorit</span></div>
              </div>
              <div class="btn-cta" style="background:${ctaColor}; color:#fff;">${cta}</div>
            </div>
          `;
          break;

        case '3': // Aesthetic POV Quote (Inline Big Quotes)
          innerContent = `
            <div class="s3-container">
              <p style="font-size:11.5px; font-style:italic; line-height:1.4; margin:4px 0; opacity:0.95;">
                <span class="quote-mark">“</span>${body}<span class="quote-mark">”</span>
              </p>
              <div style="width:28px; height:2px; background:${ctaColor}; margin:4px 0;"></div>
              <h4 style="margin:0; font-size:14px;">${title}</h4>
              <small style="font-size:8.5px; opacity:0.8;">${subtitle}</small>
              <div class="btn-cta" style="background:${ctaColor}; color:#fff; margin-top:4px;">${cta}</div>
            </div>
          `;
          break;

        case '4': // Review & Rating Card (Rapat, Bintang & Reader Stacked)
          const ratingVal = document.getElementById('s4-rating').value;
          const readersVal = document.getElementById('s4-readers').value;
          innerContent = `
            <div class="s4-container">
              <div class="s4-head">
                <div class="real-book-3d" style="background-image:url('${coverImg}'); width:55px; height:82px;"></div>
                <div style="display:flex; flex-direction:column; gap:1px;">
                  <h4 style="margin:0; font-size:13px; line-height:1.15;">${title}</h4>
                  <div class="stars">★★★★★ <span style="font-size:9.5px; color:${textColor}; font-weight:bold;">${ratingVal}</span></div>
                  <div style="font-size:8.5px; opacity:0.85;">${readersVal}</div>
                </div>
              </div>
              <div class="review-card" style="margin-top:2px;">
                <div style="font-size:8.5px; font-weight:bold; margin-bottom:1px; color:${ctaColor};">ULASAN PEMBACA:</div>
                <p style="font-size:9.5px; margin:0; font-style:italic; line-height:1.3;">"${body}"</p>
              </div>
              <div class="btn-cta" style="background:${ctaColor}; color:#fff;">${cta}</div>
            </div>
          `;
          break;

        case '5': // Character Profile
          innerContent = `
            <div class="s5-container">
              <span class="pill-tag" style="align-self:flex-start;">PROFIL KARAKTER</span>
              <div class="s5-layout">
                <div class="char-avatar" style="background-image:url('${charSingleImg}');"></div>
                <div style="flex:1;">
                  <h3 style="margin:0; font-size:15px; color:${ctaColor};">${title}</h3>
                  <div style="font-size:8.5px; font-weight:bold; margin-bottom:2px; opacity:0.9;">${subtitle}</div>
                  <p style="font-size:9.5px; line-height:1.3; margin:0;">${body}</p>
                </div>
              </div>
              <div class="btn-cta" style="background:${ctaColor}; color:#fff;">${cta}</div>
            </div>
          `;
          break;

        case '6': // Tropes & Plot Checklist (Custom Label & Compact Spacing)
          const tropes = body.split('\n').filter(t => t.trim() !== '').map(t => `<div class="trope-item"><span>[✓]</span> <span>${t}</span></div>`).join('');
          innerContent = `
            <div class="s6-container">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <h3 style="margin:0; font-size:13px; line-height:1.2;">${title}</h3>
                </div>
                <div class="real-book-3d" style="background-image:url('${coverImg}'); width:40px; height:60px;"></div>
              </div>
              <div class="review-card" style="padding:6px; margin-top:2px;">
                <div style="font-size:8.5px; font-weight:bold; color:${ctaColor}; margin-bottom:3px;">${subtitle}</div>
                <div class="trope-list">${tropes}</div>
              </div>
              <div class="btn-cta" style="background:${ctaColor}; color:#fff;">${cta}</div>
            </div>
          `;
          break;

        case '7': // Versus Conflict
          const charPos = document.getElementById('select-char-pos').value;
          const bodyLines = body.split('\n');
          innerContent = `
            <div class="s7-container">
              <div style="text-align:center;">
                <h4 style="margin:0; font-size:12px;">${title}</h4>
                <small style="font-size:8px; opacity:0.8;">${subtitle}</small>
              </div>
              <div class="versus-container">
                <div class="versus-side" style="background-image:url('${charAImg}'); background-position:${charPos};">
                  <div class="versus-overlay"></div>
                  <div class="versus-text">
                    <strong style="font-size:9.5px; color:#f43f5e;">TOKOH A</strong>
                    <p style="font-size:8px; margin:1px 0 0 0;">${bodyLines[0] || ''}</p>
                  </div>
                </div>
                <div style="align-self:center; font-weight:900; font-size:11px; color:${ctaColor}; z-index:2; text-shadow:0 2px 4px #000;">VS</div>
                <div class="versus-side" style="background-image:url('${charBImg}'); background-position:${charPos};">
                  <div class="versus-overlay"></div>
                  <div class="versus-text">
                    <strong style="font-size:9.5px; color:#3b82f6;">TOKOH B</strong>
                    <p style="font-size:8px; margin:1px 0 0 0;">${bodyLines[1] || ''}</p>
                  </div>
                </div>
              </div>
              <div class="btn-cta" style="background:${ctaColor}; color:#fff;">${cta}</div>
            </div>
          `;
          break;

        case '8': // Countdown / Event Banner
          innerContent = `
            <div class="s8-container">
              <div class="s8-badge">${title}</div>
              <div style="font-size:12px; font-weight:bold; margin-top:2px;">${subtitle}</div>
              <p style="font-size:9.5px; opacity:0.9; margin:2px 0;">"${body}"</p>
              <div class="btn-cta" style="background:${ctaColor}; color:#fff;">${cta}</div>
            </div>
          `;
          break;

        case '9': // Chapter Snippet Highlight
          innerContent = `
            <div class="s9-container">
              <div style="font-size:8.5px; font-weight:bold;">PRATINJAU BAB: ${title}</div>
              <div class="snippet-paper">
                <p style="font-size:9.5px; line-height:1.4; margin:0;">${body.replace(/(malam|rahasia|cinta|pergi|janji|mata|senyum|hati)/gi, '<span class="highlight">$1</span>')}</p>
              </div>
              <div style="font-size:8px; opacity:0.8; text-align:right;">${subtitle}</div>
              <div class="btn-cta" style="background:${ctaColor}; color:#fff;">${cta}</div>
            </div>
          `;
          break;
      }

      target.innerHTML = `
        <div class="overlay-mask ${overlayClass}"></div>
        <div class="content-layer ${fontClass}" style="color: ${textColor};">
          ${innerContent}
        </div>
      `;
    }

    function downloadImage() {
      html2canvas(document.getElementById('capture-area'), { scale: 2, useCORS: true, allowTaint: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = `promo-buku-v3.2-style${document.getElementById('select-style').value}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // Initial Setup
    handleStyleChange();
    toggleBgInputs();
  </script>
</body>
</html>
